services:
  lotusplus-app:
    build:
      context:
        ./lotusplus
      dockerfile:
        Dockerfile
    container_name:
      lotusplus-app
    restart:
      unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE:
        docker
      SPRING_DATASOURCE_URL:
        jdbc:postgresql://postgres:5432/lotusplus
      SPRING_DATASOURCE_USERNAME:
        postgres
      SPRING_DATASOURCE_PASSWORD:
        postgres
      SPRING_DATA_REDIS_HOST:
        redis
      SPRING_DATA_REDIS_PORT:
        6379
    depends_on:
      postgres:
        condition:
          service_healthy
      redis:
        condition:
          service_healthy
    networks:
      - lotusplus-network

  postgres:
    image: postgres:17
    container_name: lotusplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lotusplus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lotusplus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lotusplus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: lotusplus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lotusplus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    container_name: lotusplus-redisinsight
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    networks:
      - lotusplus-network
    volumes:
      - redisinsight_data:/db
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lotusplus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lotusplus.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lotusplus-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  redisinsight_data:

networks:
  lotusplus-network:
    driver: bridge