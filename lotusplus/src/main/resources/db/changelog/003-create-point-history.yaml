databaseChangeLog:
  - changeSet:
      id: 003-create-point-history
      author: tu

      changes:
        - createTable:
            tableName: point_history
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_point_history
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: point
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: balance_after
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: reference_type
                  type: VARCHAR(50)

              - column:
                  name: reference_id
                  type: UUID

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: point_history
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_point_history_user

        - createIndex:
            tableName: point_history
            indexName: idx_point_history_user_created
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at