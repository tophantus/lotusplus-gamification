databaseChangeLog:
  - changeSet:
      id: 002-create-checkin
      author: tu

      changes:
        - createTable:
            tableName: check_in
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_check_in
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: checkin_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: reward
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: check_in
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_checkin_user

        - addUniqueConstraint:
            tableName: check_in
            columnNames: user_id, checkin_date
            constraintName: uk_checkin_user_date

        - createIndex:
            tableName: check_in
            indexName: idx_checkin_user_date
            columns:
              - column:
                  name: user_id
              - column:
                  name: checkin_date